name: Commit format

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history is needed to resolve the range and to find the last tag.
          fetch-depth: 0
          # cz reads only commit messages and tags, so old file contents are never fetched.
          filter: blob:none
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      # PRs are rebase-merged, so every commit lands on main with its own message and
      # `cz bump` reads each one. A message that does not match is skipped without a warning.
      - name: Check every commit of the PR against the commit schema
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked --only-group dev cz check --rev-range "$BASE_SHA..$HEAD_SHA"
      - name: Show the release this PR would produce
        run: |
          set +e
          output=$(uv run --locked --only-group dev cz bump --dry-run --yes 2>&1)
          code=$?
          {
            echo "### Release preview"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Merging this PR would release:"
            elif [ "$code" -eq 21 ]; then
              echo "No release: none of the commits since the last tag is a feat, fix, refactor or perf."
            else
              echo "cz bump --dry-run failed with exit code $code:"
            fi
            echo
            echo '```'
            echo "$output" | head -n 100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ "$code" -ne 21 ]; then
            echo "$output"
            exit "$code"
          fi
