name: Docs

on:
  push:
    branches: [main]
  # Called by release.yml with the new tag. Pushing that tag with a deploy key would also
  # start a tag-triggered run, so the release goes through this one entry only.
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish as a versioned copy. Empty deploys the dev docs.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy the dev docs
        if: inputs.tag == ''
        run: uv run --locked --only-group docs mike deploy --push dev
      - name: Deploy a release
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          minor="${version%.*}"
          uv run --locked --only-group docs mike deploy --push --update-aliases "$minor" latest
          uv run --locked --only-group docs mike set-default --push latest
