# The smallest config Pylos accepts: only the keys that are required.
#
# It reads every CSV that matches the glob, checks each one against the contract
# and writes one JSON report per run. A file that fails is left where it is,
# because without an `on_failure` block the action is `ignore`.
#
# To move failing files aside, add:
#
#   on_failure:
#     action: move
#     dead_letter: output/dead-letters/
#
# See template.yml for every other key.

id: my_dataset
engine: pandas

source:
  storage: local
  file_format: csv
  file_path: data/*.csv

validation:
  contract:
    name: my_contract
    expectations:
      - expectation_type: expect_column_values_to_not_be_null
        kwargs:
          column: id

report:
  storage: local
  format: file
  path: output/reports/
